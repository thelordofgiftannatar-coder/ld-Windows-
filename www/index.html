<style>

*{box-sizing:border-box}html,body{margin:0}
body{background-color:var(--bg);background-image:var(--bgi,none);background-attachment:fixed;color:var(--tx);font-family:"Google Sans","Product Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;height:76px}

.sb{display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;background:var(--sf);padding:0 20px;margin-bottom:8px}

.chip{border:1px solid var(--ln);border-radius:16px;padding:6px 12px;font-size:13px;color:var(--tx2)}.chip.ai{background:var(--acb);color:var(--tx);border-color:transparent}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 24px}
.qa button{display:flex;align-items:center;gap:16px;height:60px;padding:0 20px;border:1px solid var(--ln);border-radius:16px;font-size:19px}.qa svg{color:var(--ac)}
.sortrow{display:flex;justify-content:flex-end;margin-bottom:14px}.sortrow button{color:var(--ac);font-size:19px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.fd .cv{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--sf)}.fd img{width:100%;height:100%;object-fit:cover;display:block}
.fd b{display:block;font-weight:400;font-size:20px;margin:10px 0 2px}.fd small{color:var(--tx2);font-size:15px}

section h3{font-size:14px;font-weight:500;margin:20px 0 8px;display:flex;gap:10px;align-items:baseline}section h3 small{color:var(--tx2);font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:4px}.row::after{content:"";flex-grow:1e6}
.ph{position:relative;margin:0;overflow:hidden;border-radius:6px;cursor:pointer;background:var(--sf);animation:fi .4s}
@keyframes fi{from{opacity:0;transform:scale(.97)}}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hb{position:absolute;top:6px;right:8px;color:#fff;font-size:20px;opacity:0;text-shadow:0 1px 4px #000}.ph:hover .hb,.hb.f{opacity:1}
.empty{padding:70px 0;text-align:center;color:var(--tx2);line-height:1.6}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--sf);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx2);font-size:18px;padding:6px 0}.bn button.on{color:var(--ac)}
#lb{position:fixed;inset:0;z-index:50;background:#000;color:#e8eaed;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px)}#lb[hidden]{display:none}
.lt{display:flex;align-items:center;gap:4px;padding:10px 12px;min-height:76px}.lt button{width:48px;height:48px;border-radius:24px;font-size:26px;text-align:center}.lt .dt{flex:1;width:auto;height:auto;border-radius:12px;font-size:20px;line-height:1.25;padding:4px 0}.dt small{display:block;font-size:15px;color:#bdc1c6}#ltt::after{content:' ›';color:#bdc1c6}#lmenu{z-index:7}.lbn{display:flex;background:#000;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}.lbn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:17px;color:#e8eaed;text-align:center}.nv{display:none}@media(hover:hover){.nv{display:block}}
.lm{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}.lm img{max-width:100%;max-height:100%;object-fit:contain}
.nv{position:absolute;top:50%;width:48px;height:48px;border-radius:24px;background:#000a;font-size:26px;transform:translateY(-50%);color:#fff;text-align:center}#pv{left:12px}#nx{right:12px}
#info{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:65%;background:var(--bg);color:var(--tx);overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #000a}#info[hidden]{display:none}

.box{background:var(--sf);border-radius:16px;padding:14px;font-size:14px;line-height:1.5;margin:10px 0}
.fld{display:flex;gap:8px;margin:8px 0}.fld input,.ti{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px}.ti{width:100%;margin-top:10px}
#ed{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}#ed[hidden]{display:none}
.et{display:flex;align-items:center;gap:8px;padding:8px 12px}.et button:not(.chip){width:44px;height:44px;border-radius:22px;font-size:20px;text-align:center}
.ec{display:flex;align-items:center;justify-content:center;min-height:0;padding:8px;background:#0b0b0c}.ec canvas{max-width:100%;max-height:100%}
.ep{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto;border-top:1px solid var(--ln)}
.ep label{display:grid;grid-template-columns:96px 1fr;align-items:center;font-size:13px;color:var(--tx2);margin:6px 0}.ep input[type=range]{width:100%}
@media(max-width:760px){#info{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:60%;border-radius:20px 20px 0 0}}
.bn{left:50%;right:auto;transform:translateX(-50%);width:min(360px,calc(100% - 28px));bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:34px;padding:7px;gap:6px;background:color-mix(in srgb,var(--sf) 72%,transparent);border:1px solid #ffffff22;box-shadow:0 10px 40px #0009,0 0 24px color-mix(in srgb,var(--ac) 25%,transparent);backdrop-filter:blur(22px) saturate(1.6)}
.bn button{border-radius:28px;padding:9px 0;font-size:15px;transition:.25s}.bn button.on{background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--tx);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent)}
html[data-th='dark'] body{background-image:radial-gradient(60% 40% at 15% 0%,#2a3b7a66,transparent 70%),radial-gradient(50% 35% at 92% 8%,#6a2a8a55,transparent 70%),radial-gradient(60% 40% at 50% 100%,#0e5a6a55,transparent 70%);background-attachment:fixed}
.ttl{font-weight:300;letter-spacing:.6px;background:linear-gradient(90deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.ttl svg{-webkit-text-fill-color:initial;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ac) 60%,transparent))}
.qa button{background:color-mix(in srgb,var(--sf) 60%,transparent);backdrop-filter:blur(12px);border-color:#ffffff24;border-radius:22px;transition:.25s}.qa button:hover,.qa button:active{box-shadow:0 0 22px color-mix(in srgb,var(--ac) 40%,transparent)}
.chip{backdrop-filter:blur(8px);border-radius:20px}
.fd .cv{border-radius:28px;box-shadow:0 8px 28px #0006;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.fd:hover .cv,.fd:active .cv{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 40px #000a,0 0 28px color-mix(in srgb,var(--ac) 35%,transparent)}
.ph{border-radius:14px}.ph img{transition:transform .5s cubic-bezier(.2,.8,.2,1)}.ph:hover img{transform:scale(1.06)}
.sc{display:flex;gap:8px;overflow-x:auto;margin:-8px 0 20px;scrollbar-width:none}.gl{white-space:nowrap;flex:none;background:color-mix(in srgb,var(--sf) 60%,transparent);border-color:#ffffff26;color:var(--tx)}.gl small{opacity:.6;margin-left:4px}
.rec{color:#ff5470!important;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}
#reel{position:fixed;inset:0;z-index:80;background:#000}#reel[hidden]{display:none}#reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}#reel img.on,#reel img.out{animation:kb 6s ease-out forwards}#reel img.on{opacity:1}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,-1%)}}#rcap{position:absolute;left:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:22px;color:#fff;text-shadow:0 2px 12px #000}#rx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;color:#fff;background:#0006}
#ims{position:fixed;inset:0;z-index:70;background:#0007;display:flex;align-items:flex-end}#ims[hidden]{display:none}.srow{display:flex;flex-direction:column;gap:3px;width:100%;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--bg) 40%,transparent);margin-top:10px;border:1px solid #ffffff1c}.srow b{font-weight:500;font-size:17px}.srow small{color:var(--tx2);font-size:13px;line-height:1.4}

.brandmark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;
 background:color-mix(in srgb,var(--ac) 18%,var(--sf));border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);
 color:var(--ac);font-size:23px;line-height:1;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 25%,transparent)}
#brandname{font-size:inherit}
.thdiy{margin-top:16px;padding-top:14px;border-top:1px solid var(--ln)}
.thdiy h5{font-size:15px;font-weight:600;margin:0 0 10px}
.thdiy .diygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.thdiy label{display:flex;flex-direction:column;gap:5px;color:var(--tx2);font-size:12px}
.thdiy input[type=text]{width:100%;min-width:0;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.thdiy input[type=color]{width:100%;height:38px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);padding:3px}
.thdiy .diyactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thdiy .diyactions button{border:1px solid var(--ln);border-radius:18px;padding:8px 12px;font-size:13px}
.thg button{min-width:0}
.thg i{border:1px solid #ffffff22}


/* Google Photos-style pinch zoom: spread = days, pinch = months */
.zoom-section{margin:0 0 18px}
.zoom-grid{display:grid;gap:4px}
.zoom-grid .ph{aspect-ratio:1;min-width:0;height:auto!important;flex:none!important;border-radius:2px}
.zoom-grid .ph img{width:100%;height:100%;object-fit:cover}
.zoom-grid.day-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.zoom-grid.month-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.zoom-grid .hb{opacity:1;top:3px;right:5px;font-size:16px}
.zoom-section h3{position:sticky;top:76px;z-index:3;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}

/* Collections tools, selection, albums, stats and map */
.toolrow{display:flex;gap:8px;overflow:auto;padding:8px 0;margin:4px 0 12px;scrollbar-width:none}
.toolrow button,.actionbar button{white-space:nowrap;border:1px solid var(--ln);border-radius:20px;padding:8px 12px;background:var(--sf);font-size:13px}
.toolrow button.active,.actionbar button.active{background:var(--acb);border-color:var(--ac);color:var(--tx)}
.titlefilter{width:100%;padding:12px 14px;margin:4px 0 12px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);font:inherit}
.actionbar{position:sticky;bottom:84px;z-index:8;display:flex;gap:8px;overflow:auto;padding:10px;background:color-mix(in srgb,var(--sf) 90%,transparent);border:1px solid var(--ln);border-radius:18px;backdrop-filter:blur(12px)}
.ph.selected{outline:3px solid var(--ac);outline-offset:-3px}
.ph .selmark{position:absolute;left:7px;top:7px;background:var(--ac);color:#101010;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700}
.statsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.statcard{background:var(--sf);border-radius:16px;padding:14px;min-width:0}
.statcard b{display:block;font-size:22px;font-weight:500;margin-top:5px}
.statcard small,.muted{color:var(--tx2)}
.statbar{height:9px;background:var(--acb);border-radius:9px;overflow:hidden;margin-top:8px}.statbar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.chart{height:130px;display:flex;align-items:end;gap:5px;padding:10px 4px 0;border-bottom:1px solid var(--ln)}
.chart span{flex:1;min-width:4px;background:var(--ac);border-radius:4px 4px 0 0;position:relative}
.chart span small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--tx2)}
.maplist,.albumlist{display:grid;gap:8px}
.mapitem,.albumitem{background:var(--sf);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.mapitem button,.albumitem button{margin-left:auto;color:var(--ac)}
.day-grid{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.month-grid{grid-template-columns:repeat(var(--mcols,4),minmax(0,1fr))}
#featurepanel{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
#featurepanel[hidden]{display:none}
.panelhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}.panelhead h2{font-weight:400;flex:1}
</style></head>
<body>
<div class="wrap">

<div class="ttl"><span id="brandmark" class="brandmark" aria-hidden="true">🌐</span><span id="brandname">Bill World</span></div>
<button class="ib" id="mn" aria-label="More">⋮</button>

<div class="sb" id="sbw" hidden><span style="color:var(--ac)">✨</span><input id="q" placeholder="Search or ask — “sunsets in June”" autocomplete="off"><button id="mic" aria-label="Voice search">🎙️</button><button id="go" aria-label="Search">⌕</button></div>

</div>

</div>

<script>
const $=s=>document.querySelector(s),ESC=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['january','february','march','april','may','june','july','august','september','october','november','december'];
const sv=(d,x='')=>`<svg width='26' height='26' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'>${d}${x}</svg>`;
const IC={star:sv("<path d='M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z'/>"),trash:sv("<path d='M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6'/>"),photo:sv("<rect x='4' y='5' width='16' height='14' rx='2'/><path d='M4 16l5-5 4 4 3-3 4 4'/>"),folder:`<svg width='26' height='26' viewBox='0 0 24 24' fill='currentColor'><path d='M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/></svg>`};
$('#nph').innerHTML=IC.photo+'Photos';$('#nfo').innerHTML=IC.folder+'Folders';
let P=[],view='folders',fold='',res=null,H=170,cur=-1,list=[],S=null,canImg=false,nid=1,sort=0,sbo=false,zoomMode='day',selectMode=false,selected=new Set(),layoutMode='comfortable',showLayoutBar=false,showTitleFilter=false,homeFolder='',albums=[],shortcuts=[],albumFilter=null,slideTimer=null;
const SORTS=['Recent','Name','Size'],live=()=>P.filter(p=>!p.del);
const fsz=n=>n<1e3?n+' B':n<1e6?Math.round(n/1e3)+' kB':n<1e9?Math.round(n/1e6)+' MB':(n/1e9).toFixed(1)+' GB';
const cnt=n=>n+(n===1?' item':' items');
const newest=(a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)||b.id-a.id;
function folders(){const m={};live().forEach(p=>{const f=m[p.folder]=m[p.folder]||{n:p.folder,a:[],s:0};f.a.push(p);f.s+=p.size||0});const r=Object.values(m);r.forEach(f=>f.a.sort(newest));return r.sort(sort===1?(a,b)=>a.n.localeCompare(b.n):sort===2?(a,b)=>b.s-a.s:(a,b)=>newest(a.a[0],b.a[0]))}
function dayLabel(iso){const d=new Date(iso+'T12:00'),n=new Date();if(d.toDateString()===n.toDateString())return'Today';return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'})}
const longDate=iso=>new Date(iso+'T12:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const upBtn=`<button class='chip ai' id='upb2'>＋ Import photos</button>`;

const featurePanel=$('#featurepanel');

/* Two-finger gallery zoom. Pinch inward groups media by month; spread outward shows individual days. */
(()=>{
 const area=$('#out');let startDistance=0,lastChange=0;
 const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

  if(e.touches.length===2 && (view==='photos'||view==='folder'||view==='favs'||view==='trash'||res)){
   startDistance=distance(e.touches);lastChange=0;
  }
 },{passive:true});
 area.addEventListener('touchmove',e=>{
  if(e.touches.length!==2||!startDistance)return;
  const delta=distance(e.touches)-startDistance;
  if(Math.abs(delta)>55 && !lastChange){
   const next=delta>0?'day':'month';
   if(next!==zoomMode){zoomMode=next;lastChange=1;render()}
   e.preventDefault();
  }
 },{passive:false});
 area.addEventListener('touchend',e=>{if(e.touches.length<2){startDistance=0;lastChange=0}});
 area.addEventListener('touchcancel',()=>{startDistance=0;lastChange=0});
})();
